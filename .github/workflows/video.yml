name: Record videos
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python e2e/video/record.py
        env:
          DEV_PATIENT: ${{ secrets.DEV_PATIENT }}
          DEV_THERAPIST: ${{ secrets.DEV_THERAPIST }}
          DEV_ADMIN: ${{ secrets.DEV_ADMIN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: vid
          retention-days: 3
