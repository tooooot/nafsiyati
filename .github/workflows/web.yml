name: Web (موقع المراجعة)
on:
  workflow_dispatch:
    inputs:
      dev_login:
        description: 'بناء اختبار فقط: تفعيل دخول ?dev= (لا يُنشر)'
        default: 'false'
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create --platforms=web,android --project-name nafsiyati --org net.wardyat .
      - run: rm -rf test
      - name: App icons from logo
        run: pip install -q pillow && python3 tools/make_icons.py
      - name: Brand web shell
        run: |
          sed -i 's#<title>nafsiyati</title>#<title>صحتي النفسية</title>#; s#content="nafsiyati"#content="صحتي النفسية"#; s#A new Flutter project.#منصة جلسات نفسية بالفيديو بخصوصية عالية#' web/index.html
          sed -i 's#"nafsiyati"#"صحتي النفسية"#g; s#A new Flutter project.#منصة جلسات نفسية بالفيديو#' web/manifest.json
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build web --release --base-href / --pwa-strategy=none --dart-define=DEV_LOGIN=${{ github.event.inputs.dev_login == 'true' }}
      - uses: actions/upload-artifact@v4
        with:
          name: nafsiyati-web
          path: build/web
          retention-days: 7
