name: Web (موقع المراجعة)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create --platforms=web,android --project-name nafsiyati --org net.wardyat .
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build web --release --base-href / --dart-define=DEV_LOGIN=true
      - uses: actions/upload-artifact@v4
        with:
          name: nafsiyati-web
          path: build/web
          retention-days: 7
