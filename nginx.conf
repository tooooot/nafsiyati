server {
  listen 80;
  charset utf-8;
  root /usr/share/nginx/html;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript application/wasm text/css application/json image/svg+xml;
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  location ~* \.(js|wasm|png|ttf|otf)$ { add_header Cache-Control "public, max-age=86400"; }
}
