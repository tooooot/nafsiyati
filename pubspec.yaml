name: nafsiyati
description: نفسيتي — عيادة نفسية بالفيديو
publish_to: none
version: 1.0.0+2
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  web: ^1.1.0
  url_launcher: ^6.3.0
  google_sign_in: ^7.1.0
  shared_preferences: ^2.3.2
  livekit_client: ^2.3.0
  image_picker: ^1.1.2
dev_dependencies:
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
